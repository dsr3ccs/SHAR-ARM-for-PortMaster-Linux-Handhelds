name: Build SHAR ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cross-compiler image
        run: docker build -f Dockerfile.aarch64 -t shar-cross .

      - name: Build SHAR
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            shar-cross \
            bash -lc 'cmake -B build-aarch64 -DARCH=aarch64 -DCMAKE_BUILD_TYPE=Release && cmake --build build-aarch64 -j2'

      - name: Save executable
        uses: actions/upload-artifact@v4
        with:
          name: shar-arm64
          path: build-aarch64/code/shar
          if-no-files-found: error
